<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="CCTV camera watching over a business building">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2A52"/><stop offset="1" stop-color="#040C1C"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBDC6A"/><stop offset="1" stop-color="#C9920E"/></linearGradient>
<linearGradient id="cy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FE3F2"/><stop offset="1" stop-color="#0A8FB0"/></linearGradient>
